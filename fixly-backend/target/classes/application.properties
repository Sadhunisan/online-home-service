spring.application.name=fixly-backend

# ---- Server ----
server.port=${PORT:8080}

# ---- Database ----
# Locally (no env vars set) this uses H2 in-memory so you can run it with zero setup.
# In production (Render/Railway) set these environment variables and it switches to Postgres automatically.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:fixlydb;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=${DATABASE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
# CHANGE this secret before deploying for real. 32+ chars.
app.jwt.secret=${JWT_SECRET:change-this-super-secret-key-before-deploy-123456}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---- CORS ----
# Comma-separated list of frontend origins allowed to call this API.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
